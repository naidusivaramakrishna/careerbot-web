name: AI PR Review (Claude + Codex)

on:
  pull_request:
    # `labeled`/`unlabeled` are here because `ai-review-waive` is the documented
    # escape hatch for a check that now BLOCKS the merge. Without them, applying
    # the label produced no new run: the red check stayed red and the only way
    # through was to hunt for "Re-run failed jobs" -- or to admin-merge, which is
    # the record-free bypass the label exists to replace. `ai-review-large` is
    # here for the same reason: a maintainer applies it to lift the size caps on
    # a PR the scope guard refused, and that must start the review. ONLY
    # MAINTAINERS should apply `ai-review-large` -- the report names who did
    # (see SIZE_OVERRIDE_LABEL in scripts/ai_review/ai_pr_review.py).
    # EVERY other label event runs the ai-review job too -- it must, because
    # `ai-review` is a required check, a SKIPPED job counts as a PASSING check
    # run, and the newest run on the head commit is the one that counts: when
    # unrelated labels skipped the job, adding any label to a PR whose review
    # had failed turned it mergeable, unreviewed (#117). Such a run does not
    # re-review: the script re-derives the verdict from the review already
    # posted for the head (see label_event in ai_pr_review.py).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issue_comment:
    # REQUIRES A MASTER SYNC: GitHub runs issue_comment (and schedule) workflows
    # from the DEFAULT branch's copy of this file, which is `master`, not the
    # branch this file is on. Until master carries this file, comments are
    # handled by master's copy: no OWNER/MEMBER/COLLABORATOR check on
    # `/ai-review`, the plain concurrency group, and its hourly
    # `schedule: cron "47 * * * *"` sweep keeps running. Removing `schedule:`
    # here and the author_association gate below do nothing until then.
    #
    # Security invariant: this privileged trigger checks out the default branch.
    # The review script may fetch the PR ref for git diff/show, but must never
    # check it out or execute PR-authored code. Dynamic commands run only from
    # this trusted checkout. Keep this true if the review harness is changed.
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (blank = review ALL open PRs)"
        required: false

permissions:
  contents: read
  # Label runs look up whether an earlier run is still reviewing this head
  # (earlier_run_in_flight in ai_pr_review.py) instead of reviewing it twice.
  actions: read
  pull-requests: write
  issues: write

# One global queue with no cancellation meant every push stacked another
# ~25-minute review behind the last one, and all PRs shared the same queue.
# Because the AI review and the CI jobs run on the SAME physical self-hosted
# runner, that backlog also starved Lint and Build / Security Scan.
#
# Per-PR group: two different PRs no longer block each other (they still
# serialise at the runner, which is the real capacity limit).
# cancel-in-progress: a new push supersedes the previous review of that same
# PR.
#
# cancel-in-progress came from the master copy of this workflow, which already
# had the fix. The group below has since diverged from master's (see there).
concurrency:
  # pull_request runs that do not START a review -- a draft PR (job runs, sees
  # the PR is still a draft and exits 0 without calling a model), or a label
  # other than ai-review-waive / ai-review-large (job runs, but only re-derives
  # the verdict already posted for the head; it waits for an in-flight review
  # rather than repeating it) -- get their own `-noreview` group. Concurrency applies to the whole RUN, so inside the review group such
  # a run would either cancel the in-flight review (cancel-in-progress) or --
  # whatever cancel-in-progress says -- replace a PENDING requested /ai-review
  # run, because GitHub keeps at most one pending run per group. In their own
  # group they only supersede each other.
  # issue_comment runs that are NOT a trusted `/ai-review` on a PR (an ordinary
  # comment, or `/ai-review` from a CONTRIBUTOR/NONE) get `-comment` for the same
  # reason: every job in them is skipped, yet in the review group they would
  # replace a pending requested /ai-review; in `-noreview` they would replace a
  # pending draft run. Only a trusted `/ai-review` comment enters the review group.
  # (Takes effect for comments only after the master sync noted under `on:`.)
  # The issue_comment condition is the negation of the issue_comment clause of
  # the ai-review job `if` below; the pull_request condition is the payload's
  # draft flag (the script's draft exit, event_was_draft) plus the
  # unrelated-label case (is_unrelated_label_event). Keep them in sync
  # (tests/unit/test_ci_draft_policy.py).
  group: >-
    ai-pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}${{
    (github.event_name == 'pull_request' &&
    (github.event.pull_request.draft ||
    ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
    github.event.label.name != 'ai-review-waive' &&
    github.event.label.name != 'ai-review-large'))) && '-noreview' ||
    (github.event_name == 'issue_comment' &&
    !(github.event.issue.pull_request != null &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
    github.event.comment.author_association) &&
    startsWith(github.event.comment.body, '/ai-review'))) && '-comment' || '' }}
  # NOT unconditional -- see the default-branch (master) copy, which is the one
  # that handles issue_comment today. Any comment on a PR fires an issue_comment
  # run whose group resolves to ai-pr-review-<PR#> via github.event.issue.number
  # (in master's copy; above, only a trusted `/ai-review` does), landing it in
  # the SAME group as a review already running for that PR. The job-level `if`
  # skips the JOB, but the RUN still joins the group and cancel-in-progress kills
  # the real review first (careerbot-web#61: twice, ~5s after each comment).
  #
  # Kept in sync here so a merge down to the default branch does not silently
  # revert the fix -- this branch is thousands of commits ahead of it.
  # Draft runs no longer need an exception here: they are in the `-noreview`
  # group above, where superseding each other is exactly what we want.
  # The issue_comment exception is still needed: a trusted `/ai-review` enters
  # the review group and must queue behind a running review, not kill it.
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  ai-review:
    # The issue_comment clause (incl. the author_association gate) is live only
    # once master carries this file -- see the note under `on: issue_comment`.
    #
    # NEVER skip this job for ANY pull_request event, whatever the action, the
    # label or the draft flag: `ai-review` is a required check and a skipped job
    # is a passing check run, so any skipped pull_request run turns the gate
    # green (#117). Unrelated-label runs stay cheap in the script (label_event).
    # Drafts are NOT skipped here either: "Re-run all jobs" replays the ORIGINAL
    # event payload, so re-running a run from when the PR was a draft kept
    # `draft: true`, skipped again, and that skipped run became the newest
    # `ai-review` check run on a head whose real review had failed. Instead the
    # script reads the PR's LIVE draft state (live_pr_state): still a draft ->
    # exit 0 at once, no model call (GitHub refuses to merge a draft, and
    # `ready_for_review` starts a new run); ready -> the verdict already posted
    # for the head is re-derived, exactly as for a label run. The draft flag is
    # still used above, only to keep such runs in the `-noreview` group.
    #
    # LIMIT: a re-run replays the original run's commit, and with it that
    # commit's copy of this file. A skipped draft/label run created BEFORE this
    # fix (e.g. 36172176433 on #117) can still be re-run into a skipped, passing
    # `ai-review`; nothing in this file can reach those runs. The remedy is
    # branch protection (who may re-run and merge) plus this fix, which covers
    # every run created from now on; an open PR whose newest check run is such
    # a pre-fix skip needs a fresh pull_request event (a push, or a label) once
    # this is merged.
    # issue_comment runs cannot open this hole: their check runs attach to the
    # default branch's head commit, not the PR's head (checked on #117: run
    # 36173496504 has head_sha 94e3f8e = master), so a skipped comment run never
    # touches the PR's required check.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/ai-review'))
    runs-on: [self-hosted, ai-review]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Next.js build sometimes needs a public API base at build time; harmless default.
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || '/api/v1' }}

    steps:
      - name: Checkout (full history for merge-base + at-SHA reads)
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Decide target
        id: t
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--pr ${{ github.event.pull_request.number }} --dynamic" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "args=--pr ${{ github.event.issue.number }} --dynamic" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr }}" ]; then
            echo "args=--pr ${{ github.event.inputs.pr }} --dynamic" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all --dynamic" >> "$GITHUB_OUTPUT"
          fi

      - name: Run review (T1 static + T2 build/lint)
        env:
          # Via env, not ${{ }} in the script: a label name is user-supplied text.
          AI_REVIEW_EVENT_ACTION: ${{ github.event_name == 'pull_request' && github.event.action || '' }}
          AI_REVIEW_EVENT_LABEL: ${{ github.event.label.name }}
          # The head this run's check run is attached to, and whether the PR was
          # a draft when the event fired. Both are from the (possibly replayed)
          # payload; the script compares them with the PR's live state.
          AI_REVIEW_EVENT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          AI_REVIEW_EVENT_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'true' || 'false' }}
        run: |
          python3 scripts/ai_review/ai_pr_review.py \
            --repo "${{ github.repository }}" \
            ${{ steps.t.outputs.args }}

  # careerbot-web has no Python test runner of its own. Without this job its copy
  # of the gate (and the workflow-policy tests next to it) would be the code
  # nobody checks. test_ai_review_gate.py is the same suite that guards
  # careerbot-ai and careerbot-api.
  gate-self-test:
    # issue_comment fires for every comment on every issue/PR, from anyone;
    # there is nothing for this job to test on those events.
    if: github.event_name != 'issue_comment'
    runs-on: [self-hosted, ai-review]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install --quiet pytest pyyaml
      - name: Run the gate's own test suite and the workflow-policy tests
        run: python3 -m pytest tests/unit -q --override-ini="addopts="

name: AI PR Review (Claude + Codex)

on:
  # Review the moment a PR is opened or a new commit is pushed.
  pull_request:
    types: [opened, synchronize, reopened]
  # On-demand: comment `/ai-review` on a PR.
  issue_comment:
    types: [created]
  # Idempotent safety-net sweep of all open PRs.
  schedule:
    - cron: "*/30 * * * *"
  # Manual: one PR (input) or blank = sweep all.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (blank = review ALL open PRs)"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review
  cancel-in-progress: false

jobs:
  ai-review:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/ai-review'))
    # Same self-hosted laptop runner as careerbot-api. Register this repo's
    # runner with the label `ai-review` (see scripts/ai_review/RUNNER_SETUP.txt).
    runs-on: [self-hosted, ai-review]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Self-hosted box: the `claude` + `codex` CLIs are already logged in as the
      # runner user, so we do NOT inject ANTHROPIC_API_KEY / OPENAI_API_KEY
      # (empty unset secrets would override and break local CLI auth).
    steps:
      - name: Checkout (full history for merge-base + at-SHA reads)
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Decide target
        id: t
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--pr ${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "args=--pr ${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr }}" ]; then
            echo "args=--pr ${{ github.event.inputs.pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run two-model static review (Claude finds, Codex cross-checks)
        run: |
          python3 scripts/ai_review/ai_pr_review.py \
            --repo "${{ github.repository }}" \
            ${{ steps.t.outputs.args }}

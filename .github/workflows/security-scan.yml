name: Security Scan

on:
  # Run on EVERY pull request, whatever it targets and whatever the source
  # branch is called. Previously this was `branches: [master, develop2]`, and
  # since every PR targets an integration branch such as
  # feature/all-updated-features, NO pull_request run ever matched. Checks only
  # appeared via the `push` trigger below, which matched `feature/**` — so a
  # branch named fix/*, chore/* or hotfix/* got NO lint, NO build and NO
  # security scan, and its PR showed a single green ai-review tick that looked
  # like a full pass.
  pull_request:
    branches: ['**']
  # Direct pushes to the long-lived branches only. Feature branches are covered
  # by the pull_request trigger above; keeping `feature/**` here as well would
  # run every check TWICE per PR. Two runners are registered but only one is
  # normally online, so effective capacity is ONE.
  push:
    branches: [master, develop2]
  # npm audit moved off the per-PR path (see the npm-audit job below): it
  # could never fail a PR, but it was costing 6-12 minutes of the ONE online
  # runner on every push. The nightly run is for npm audit only (gitleaks skips
  # `schedule`). GitHub reads `schedule` from the DEFAULT branch only
  # (master), so the nightly takes effect once this reaches master and audits
  # master's lockfile; develop2 is audited on every push to it and on demand
  # (Actions > Security Scan > Run workflow, branch develop2).
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:


# Supersede in-flight runs for the same PR. Every push to a PR - or to the
# base branch a PR targets - queues a fresh round of these jobs, and they all
# land on ONE self-hosted runner shared with the AI review. Without this, five
# pushes meant five full rounds queued back to back, and the checks that
# actually gate a merge sat behind reviews of commits already superseded.
#
# github.workflow is part of the group key so Frontend CI and Security Scan do
# not cancel each other - they are separate workflows and both must report.
#
# Scheduled runs get their OWN group. A `schedule` run takes the default
# branch's ref, so in the shared group the nightly (which skips gitleaks) would
# cancel an in-flight push-to-master run and those commits would never get
# their gitleaks scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Runs FIRST; every other job needs it and FAILS (not skips) at its first
  # step when it did not pass. See FAIL-CLOSED in .github/workflows/pr-size-gate.yml.
  pr-size:
    name: PR Size
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-size-gate.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
    with:
      gate: security-scan
      runs-on: '["self-hosted", "Linux", "X64"]'

  npm-audit:
    name: npm audit
    needs: pr-size
    # NOT on pull_request. On PRs both audit steps ended in `|| true`, so this
    # job could never fail a PR -- it reported a result nobody could act on
    # while holding a runner for 6-12 minutes per push, serialising every other
    # PR behind it. It now runs on every push to master/develop2, nightly, and
    # on demand, and FAILS (red run + notification) on a high/critical
    # advisory, so a new advisory is surfaced within a day.
    # It is not a required check (branch protection requires only `ai-review`
    # and `Lint and Build`), so dropping it from PRs blocks nothing.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      # FIRST step, before anything heavy -- keep it first. Fails this job when
      # the PR Size gate did not pass, so the job reports FAILURE instead of a
      # skipped (= passing) required check. No-op on non-PR events, where
      # pr-size is skipped. See FAIL-CLOSED in pr-size-gate.yml.
      - name: PR size gate
        if: github.event_name == 'pull_request' && needs.pr-size.result != 'success'
        env:
          GATE_RESULT: ${{ needs.pr-size.result }}
        run: |
          echo "::error title=PR size gate failed::PR Size result: $GATE_RESULT. This job stops here; see the PR Size check for the numbers and how to split the PR."
          echo "### ❌ PR size gate failed — see PR Size (result: \`$GATE_RESULT\`)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm to match lockfile generator
        run: npm install -g npm@11 || echo "skipping global npm upgrade (no permission on self-hosted runner)"

      - name: Install dependencies
        run: npm ci

      # These steps CAN fail, on purpose. Off the PR path a red run blocks
      # nothing (this job never runs on a PR and is not a required check), and
      # a red nightly / post-merge run is the signal: GitHub marks the branch
      # and notifies on a failed scheduled run. With `|| true` a new high or
      # critical advisory sat in a log that was green every time. Both steps
      # always run and write what they found to the run summary.
      - name: npm audit (production, high+)
        run: |
          set -o pipefail
          if npm audit --omit=dev --audit-level=high 2>&1 | tee audit-prod.txt; then
            echo "### ✅ npm audit (production, high+): no findings" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### ❌ npm audit (production, high+) found advisories"; echo '```'; tail -n 40 audit-prod.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: npm audit (full, critical)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if npm audit --audit-level=critical 2>&1 | tee audit-full.txt; then
            echo "### ✅ npm audit (full, critical): no findings" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### ❌ npm audit (full, critical) found advisories"; echo '```'; tail -n 40 audit-full.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  gitleaks:
    name: Gitleaks Secret Detection
    needs: pr-size
    # Not on the nightly schedule: that exists for npm audit. A full-history
    # gitleaks scan at 01:30 finds nothing the push run did not, and would
    # hold the single runner. Still runs on every PR, push and manual dispatch.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      # FIRST step, before anything heavy -- keep it first. Fails this job when
      # the PR Size gate did not pass, so the job reports FAILURE instead of a
      # skipped (= passing) required check. No-op on non-PR events, where
      # pr-size is skipped. See FAIL-CLOSED in pr-size-gate.yml.
      - name: PR size gate
        if: github.event_name == 'pull_request' && needs.pr-size.result != 'success'
        env:
          GATE_RESULT: ${{ needs.pr-size.result }}
        run: |
          echo "::error title=PR size gate failed::PR Size result: $GATE_RESULT. This job stops here; see the PR Size check for the numbers and how to split the PR."
          echo "### ❌ PR size gate failed — see PR Size (result: \`$GATE_RESULT\`)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A self-hosted runner keeps /tmp between jobs; a GitHub-hosted one does
      # not. gitleaks-action downloads to a fixed /tmp/gitleaks.tmp and refuses
      # to overwrite an existing file, so the first self-hosted run succeeded
      # and every run after it failed with "Destination file path
      # /tmp/gitleaks.tmp already exists". Clear it before each run.
      - name: Clear stale gitleaks download (self-hosted /tmp persists)
        run: rm -rf /tmp/gitleaks.tmp /tmp/gitleaks-*

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

name: Security Scan

on:
  # Run on EVERY pull request, whatever it targets and whatever the source
  # branch is called. Previously this was `branches: [master, develop2]`, and
  # since every PR targets an integration branch such as
  # feature/all-updated-features, NO pull_request run ever matched. Checks only
  # appeared via the `push` trigger below, which matched `feature/**` — so a
  # branch named fix/*, chore/* or hotfix/* got NO lint, NO build and NO
  # security scan, and its PR showed a single green ai-review tick that looked
  # like a full pass.
  pull_request:
    branches: ['**']
  # Direct pushes to the long-lived branches only. Feature branches are covered
  # by the pull_request trigger above; keeping `feature/**` here as well would
  # run every check TWICE per PR. Two runners are registered but only one is
  # normally online, so effective capacity is ONE.
  push:
    branches: [master, develop2]


# Supersede in-flight runs for the same PR. Every push to a PR - or to the
# base branch a PR targets - queues a fresh round of these jobs, and they all
# land on ONE self-hosted runner shared with the AI review. Without this, five
# pushes meant five full rounds queued back to back, and the checks that
# actually gate a merge sat behind reviews of commits already superseded.
#
# github.workflow is part of the group key so Frontend CI and Security Scan do
# not cancel each other - they are separate workflows and both must report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Runs FIRST; every other job needs it and FAILS (not skips) at its first
  # step when it did not pass. See FAIL-CLOSED in .github/workflows/pr-size-gate.yml.
  pr-size:
    name: PR Size
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-size-gate.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
    with:
      gate: security-scan
      runs-on: '["self-hosted", "Linux", "X64"]'

  npm-audit:
    name: npm audit
    needs: pr-size
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      # FIRST step, before anything heavy -- keep it first. Fails this job when
      # the PR Size gate did not pass, so the job reports FAILURE instead of a
      # skipped (= passing) required check. No-op on non-PR events, where
      # pr-size is skipped. See FAIL-CLOSED in pr-size-gate.yml.
      - name: PR size gate
        if: github.event_name == 'pull_request' && needs.pr-size.result != 'success'
        env:
          GATE_RESULT: ${{ needs.pr-size.result }}
        run: |
          echo "::error title=PR size gate failed::PR Size result: $GATE_RESULT. This job stops here; see the PR Size check for the numbers and how to split the PR."
          echo "### ❌ PR size gate failed — see PR Size (result: \`$GATE_RESULT\`)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm to match lockfile generator
        run: npm install -g npm@11 || echo "skipping global npm upgrade (no permission on self-hosted runner)"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production, advisory)
        run: npm audit --omit=dev --audit-level=high || true

      - name: npm audit (full, advisory)
        run: npm audit --audit-level=critical || true

  gitleaks:
    name: Gitleaks Secret Detection
    needs: pr-size
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      # FIRST step, before anything heavy -- keep it first. Fails this job when
      # the PR Size gate did not pass, so the job reports FAILURE instead of a
      # skipped (= passing) required check. No-op on non-PR events, where
      # pr-size is skipped. See FAIL-CLOSED in pr-size-gate.yml.
      - name: PR size gate
        if: github.event_name == 'pull_request' && needs.pr-size.result != 'success'
        env:
          GATE_RESULT: ${{ needs.pr-size.result }}
        run: |
          echo "::error title=PR size gate failed::PR Size result: $GATE_RESULT. This job stops here; see the PR Size check for the numbers and how to split the PR."
          echo "### ❌ PR size gate failed — see PR Size (result: \`$GATE_RESULT\`)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A self-hosted runner keeps /tmp between jobs; a GitHub-hosted one does
      # not. gitleaks-action downloads to a fixed /tmp/gitleaks.tmp and refuses
      # to overwrite an existing file, so the first self-hosted run succeeded
      # and every run after it failed with "Destination file path
      # /tmp/gitleaks.tmp already exists". Clear it before each run.
      - name: Clear stale gitleaks download (self-hosted /tmp persists)
        run: rm -rf /tmp/gitleaks.tmp /tmp/gitleaks-*

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
